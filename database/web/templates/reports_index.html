{% extends "base.html" %}
{% block title %}Reports{% endblock %}

{% block content %}
<h1>Reports</h1>
<p class="lead">Each report reads one SQL view from <code>queries.sql</code>.</p>

<ul class="report-list">
  {% for slug, r in reports.items() %}
    <li>
      <a href="{{ url_for('report', slug=slug) }}">{{ r.title }}</a>
      <span>{{ r.about }}</span>
    </li>
  {% endfor %}
</ul>
{% endblock %}
